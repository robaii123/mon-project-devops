name: pipeline

on:
  push:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Upload the repository
        uses: actions/checkout@v4

      - name: Telecharger les dependency
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest

  build-and-push:
    runs-on: ubuntu-latest

    needs: run-tests

    steps:
      - name: Upload the repository
        uses: actions/checkout@v4

      - name: Se connecte à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build et Push à Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t $DOCKER_USER/mon-api-flask:latest .
          docker push $DOCKER_USER/mon-api-flask:latest
  deploy:
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:
      - name: Deployer sur Render Cloud
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        